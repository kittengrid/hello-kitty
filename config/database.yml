default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  url: <%= ENV.fetch('DATABASE_URL', "postgresql://#{ENV.fetch('DATABASE_USER', 'postgres')}:#{ENV.fetch('DATABASE_PASS', 'postgres')}@#{ENV.fetch('DATABASE_HOST', '0.0.0.0')}") %>
  database:  <%= ENV.fetch('DATABASE_NAME', 'hello_kitty_development') %>

test:
  <<: *default
  database: hello_kitty_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
